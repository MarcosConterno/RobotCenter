version: "3.8"

services:
  robot-center:
    image: ${ROBOT_CENTER_IMAGE:?Configure ROBOT_CENTER_IMAGE com uma tag publicada pelo CI}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DOCUMENT_STORAGE_DIR: /app/data/storage
    secrets:
      - source: database_url
        target: database_url
      - source: database_admin_url
        target: database_admin_url
    volumes:
      - document_storage:/app/data/storage
    ports:
      - target: 3000
        published: ${APP_PUBLISHED_PORT:-3000}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.robot-center-storage == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

secrets:
  database_url:
    external: true
    name: ${DATABASE_URL_SECRET_NAME:-robot-center-database-url}
  database_admin_url:
    external: true
    name: ${DATABASE_ADMIN_URL_SECRET_NAME:-robot-center-database-admin-url}

volumes:
  document_storage:
    external: true
    name: ${DOCUMENT_STORAGE_VOLUME_NAME:-robot-center-document-storage}
