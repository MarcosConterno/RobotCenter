services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robot_center}
      POSTGRES_USER: ${POSTGRES_USER:-robot_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - robot_center_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robot_center} -d ${POSTGRES_DB:-robot_center}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-robot_center}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-robot_center}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-robot_center}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-robot_center}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DOCUMENT_STORAGE_DIR: /app/data/storage
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - robot_center_document_storage:/app/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  robot_center_postgres_data:
  robot_center_document_storage:
